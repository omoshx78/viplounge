name: Run database migration / seed
on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Also run seed data (demo accounts/records — skip for production)'
        type: boolean
        default: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run migration
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run seed (optional)
        if: ${{ inputs.run_seed }}
        run: npm run seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
