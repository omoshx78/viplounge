services:
  - type: web
    name: vip-lounge-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vip-lounge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://your-app.vercel.app
      - key: PORT
        value: 4000

# NOTE: Render's free plan does not support the "cron" service type (that needs a paid plan),
# so the scheduled 30-day image-purge job is NOT included here. It's run instead as a free
# GitHub Actions scheduled workflow — see .github/workflows/purge-images.yml in the repo root.
# If you later upgrade this web service off the free plan, you can add the cron job back:
#
#   - type: cron
#     name: vip-lounge-image-purge
#     env: node
#     plan: starter
#     rootDir: backend
#     schedule: "0 3 * * *"
#     buildCommand: npm install
#     startCommand: npm run purge-images
#     envVars:
#       - key: DATABASE_URL
#         fromDatabase:
#           name: vip-lounge-db
#           property: connectionString

databases:
  - name: vip-lounge-db
    plan: free
